<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- One static, locally bundled noise tile used as the app's paper grain.
       Nothing here animates and nothing loads from the network: the browser
       rasterises this once and tiles the result inside the cream surfaces. -->
  <filter id="stackd-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="140" height="140" filter="url(#stackd-grain)" opacity="0.13" />
</svg>